# this file borrowed heavily from http://pastebin.com/VAWMGGqF by Keith Amling
#
# ONE shared config for every machine. Machine differences are expressed here
# as conditionals rather than as per-host copies of this file:
#   - `%if "#{==:#{host_short},<name>}"` for things that cannot be detected
#     (which prefix this box wants, what belongs in the status bar)
#   - `if-shell 'command -v <tool>'` for things that can be
# Anything genuinely local and untracked goes in ~/.tmux.conf.local, sourced
# at the bottom.
#
# Every machine runs ~/bin/tmux (the amling fork, next-3.7) via `tma`, so the
# fork-only copy-mode commands below are safe unguarded.

####
## Screen Compat
####

# set meta key to be same as screen
set -g prefix C-a
unbind-key C-b
bind-key a send-prefix
bind-key C-a last-window

# portal and corebox are frequently nested inside a tmux from ANOTHER machine
# (which uses C-a), so sharing the prefix makes every inner command C-a C-a.
%if "#{||:#{==:#{host_short},portal},#{==:#{host_short},corebox}}"
set -g prefix C-x
unbind-key C-a
bind-key x send-prefix
bind-key C-x last-window
%endif

bind-key ' ' next-window
bind-key 'Escape' copy-mode

# make ctrl+letter equal to letter alone for these in case I don't release ctrl
# fast enough
bind-key 'C-]' paste-buffer
bind-key ']' paste-buffer
bind-key C-n next-window
bind-key C-p previous-window

bind-key '=' choose-buffer -r -Z

# best thing ever.
# https://github.com/amling/tmux/commit/52fb1fb41dd1295d691d1779e1c078845001072a
bind-key -T copy-mode-vi ' ' send -X start-or-copy-selection

# this clobbers something so isn't a default
bind-key -T copy-mode-vi J send -X change-joinmode

# block/column copy pruning (fork only)
bind-key -T copy-mode-vi c send -X left-prune
bind-key -T copy-mode-vi C send -X right-prune

# vi-style copy mode (needed for the fork bindings on the copy-mode-vi table)
set-option -g mode-keys vi

# kill kill kill  (quote it -- bare \ is a line continuation)
bind-key '\' kill-window

####
## Others
####
# type faster
set -sg escape-time 0

# find all the history, every last one
# default is ~2k ?
set -g history-limit 100000
set -g buffer-limit 100000

# C-a w => show windows
# so C-a C-w => show sessions
bind-key C-w choose-session

# this is way better than screen...
set-option -g status-right "%Y%m%d %H:%M"
set-option -g status-bg black
set-option -g status-fg brightgreen

# the work laptop has extra status helpers (trackpad suppression, VPN, battery)
%if "#{==:#{host_short},cmyers-MacBook-Pro}"
set-option -g status-right "#(~/bin/trackpad --tmux)#(~/bin/vpn-status --tmux)#(~/bin/battery-status --tmux)%Y%m%d %H:%M"
%endif

# tmux 2.9-ish new way:
set-option -g window-status-style bg=black,fg=brightgreen
set-option -g window-status-current-style bg=green,fg=black
set-option -g window-status-activity-style bg=black,fg=brightblue

unbind-key r
bind-key r source-file ~/.tmux.conf

# pane selection
bind-key 'C-1' attach -t main
bind-key 'C-2' attach -t chat

# removes trailing '-' and '*' on last and current window
# current I can get from display color and last I can guess when/if I care
set-option -g window-status-format '#I:#W'
set-option -g window-status-current-format '#I:#W'
set-option -g window-status-separator '|'

# highlight active pane border
set -g pane-active-border-style fg=brightcyan
set -g pane-border-style fg=colour238
set -g pane-border-lines heavy

# vim-style pane navigation (arrow keys also still work)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# vim-style pane resizing (uppercase, 5 cells at a time)
bind-key H resize-pane -L 5
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key L resize-pane -R 5

# push the tmux buffer to the system clipboard with whatever this box has.
# Later blocks win, so these run least- to most-preferred (X11 boxes have both
# wl-copy and xsel; xsel is the right one there).
if-shell 'command -v pbcopy >/dev/null 2>&1' 'set -g @clipcmd "pbcopy"'
if-shell 'command -v wl-copy >/dev/null 2>&1' 'set -g @clipcmd "wl-copy"'
if-shell 'command -v xsel >/dev/null 2>&1' 'set -g @clipcmd "xsel --clipboard --input"'
bind-key Y run-shell 'c="#{@clipcmd}"; if [ -n "$c" ]; then tmux save-buffer - | eval "$c" && tmux display "Copied to clipboard"; else tmux display "no clipboard tool on this host"; fi'

set -g default-terminal "tmux-256color"

# scrollback recovery + alternate-screen guards (synced via private_notes)
source-file -q ~/projects/private_notes/config/tmux/scrollback.conf

# machine-local overrides that do not belong in the repo (never tracked)
source-file -q ~/.tmux.conf.local
